[workspace]
resolver = "2"
members = ["crates/simpletickets-core", "crates/simpletickets", "plugins/mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/MichalVacek/SimpleTickets"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
