[workspace]
resolver = "2"
members = [
    "crates/simpletickets-core",
    "crates/simpletickets",
    "plugins/mcp",
    "plugins/connector-protocol",
    "plugins/connector-archive",
    "plugins/sync",
    "plugins/connector-jira",
    "plugins/ui",
    "examples/plugins/follow-up",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/MichalVacek/SimpleTickets"
license = "MIT"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
