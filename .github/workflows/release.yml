name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p simpletickets -p simpletickets-mcp -p simpletickets-ui -p simpletickets-sync -p simpletickets-connector-archive -p simpletickets-connector-jira
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="simpletickets-${{ matrix.target }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/simpletickets target/${{ matrix.target }}/release/simpletickets-mcp target/${{ matrix.target }}/release/simpletickets-ui target/${{ matrix.target }}/release/simpletickets-sync target/${{ matrix.target }}/release/simpletickets-connector-archive target/${{ matrix.target }}/release/simpletickets-connector-jira dist/
          mkdir -p dist/plugins/mcp dist/plugins/ui dist/plugins/sync dist/plugins/connector-archive dist/plugins/connector-jira
          cp plugins/mcp/plugin.yml dist/plugins/mcp/
          cp plugins/ui/plugin.yml dist/plugins/ui/
          cp plugins/sync/plugin.yml dist/plugins/sync/
          cp plugins/connector-archive/plugin.yml dist/plugins/connector-archive/
          cp plugins/connector-jira/plugin.yml dist/plugins/connector-jira/
          tar -czf "$name.tar.gz" -C dist simpletickets simpletickets-mcp simpletickets-ui simpletickets-sync simpletickets-connector-archive simpletickets-connector-jira plugins
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "simpletickets-${{ matrix.target }}"
          $release = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Path dist/plugins | Out-Null
          foreach ($plugin in "mcp", "ui", "sync", "connector-archive", "connector-jira") {
            New-Item -ItemType Directory -Path "dist/plugins/$plugin" | Out-Null
            Copy-Item "plugins/$plugin/plugin.yml" "dist/plugins/$plugin/"
          }
          Compress-Archive -Path "$release/simpletickets.exe", "$release/simpletickets-mcp.exe", "$release/simpletickets-ui.exe", "$release/simpletickets-sync.exe", "$release/simpletickets-connector-archive.exe", "$release/simpletickets-connector-jira.exe", "dist/plugins" -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: simpletickets-${{ matrix.target }}
          path: |
            simpletickets-${{ matrix.target }}.tar.gz
            simpletickets-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum simpletickets-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
