[package]
name = "simpletickets-sync"
description = "Sync plugin: mirrors tickets to other trackers through connector processes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
simpletickets-connector-protocol = { path = "../connector-protocol" }

[dev-dependencies]
simpletickets = { path = "../../crates/simpletickets" }
tempfile = "3.27.0"
