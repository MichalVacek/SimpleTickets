name: sync
version: 0.1.0
description: Mirrors tickets to other trackers through connector plugins (built against Jira)
api_version: 1
kind: service
command: simpletickets-sync
args:
  - run
capabilities:
  - tickets.read
  - tickets.write
  - events
install:
  package: simpletickets-sync
  binary: simpletickets-sync
