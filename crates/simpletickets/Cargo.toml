[package]
name = "simpletickets"
description = "SimpleTickets command line and daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
getrandom = "0.3.4"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simpletickets-core = { path = "../simpletickets-core" }
tiny_http = "0.12.0"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
